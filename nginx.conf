server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae a index.html,
    # así React Router maneja /gastos, /catalogo, /locales, /usuarios, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para los assets con hash en el nombre (los que genera Vite).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
